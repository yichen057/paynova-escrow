# PayNova Escrow — one-command local run: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paynova
      POSTGRES_USER: paynova
      POSTGRES_PASSWORD: paynova
    ports:
      # Host port 5433 avoids clashing with a PostgreSQL that may already run locally (5432).
      # Left of the colon = port on your machine, right = port inside the container; the app
      # container uses the internal network (db:5432) and is unaffected.
      # To connect with psql/DBeaver, use localhost:5433
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paynova"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/paynova
      DB_USER: paynova
      DB_PASSWORD: paynova
      # Must be provided via .env or the shell, no default (generate with openssl rand -base64 32 and put it in .env)
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required, generate one with openssl rand -base64 32}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
