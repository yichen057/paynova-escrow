name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # Docker available -> Testcontainers ITs run here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # mvn verify = unit tests (surefire) + Testcontainers integration tests (failsafe).
      # CI runs deterministic tests only; destructive experiments (e.g. deadlock repro)
      # are manual by design (design doc §12).
      - run: mvn -B verify
