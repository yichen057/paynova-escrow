# Docker Engine 29+ requires API 1.44 at minimum, but the docker-java client in
# Testcontainers 1.x falls back to API 1.32 when negotiation fails, which the server
# rejects with 400 (testcontainers-java #11210).
# This file forces the client to use 1.44. It can be removed after upgrading to Testcontainers 2.x.
api.version=1.44
